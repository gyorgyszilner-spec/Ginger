<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>HEATWAVE – vezetett kalibráció</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d15;color:#f5f7fa;font-family:system-ui,Arial,sans-serif}#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(7px,1.6vh,16px) clamp(12px,3vw,40px);gap:1.4vh}header{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,1.7vw,18px);color:#a6b7c9;height:7vh;flex-shrink:0}#phase{color:#ffd18a}#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.3vh;text-align:center}h1{font-size:clamp(21px,4.6vw,58px);line-height:1.1;margin:0;max-width:95%}#hint{font-size:clamp(13px,2.3vw,27px);color:#b4c8d9;max-width:95%;margin:0}#visual{height:29vh;min-height:55px;width:min(72vw,700px);display:flex;align-items:center;justify-content:center;gap:2vw}#symbol{font-size:clamp(55px,14vh,150px);line-height:1}#state{font-size:clamp(19px,4vw,50px);font-weight:800;color:#62e8bd}#aim{display:none;position:relative;width:100%;height:100%;border:2px solid #62798d;border-radius:10px;background:linear-gradient(90deg,transparent 49.8%,#3b5365 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#3b5365 50%,transparent 50.2%),#102030;overflow:hidden}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffbf67;font-size:clamp(28px,6vw,60px)}footer{display:flex;justify-content:space-between;align-items:center;gap:2vw;flex-shrink:0;height:13vh}button{background:#273b51;color:white;border:1px solid #6a849c;border-radius:10px;padding:1.5vh 2.6vw;font-size:clamp(13px,2.2vw,24px);font-weight:700;min-height:44px;touch-action:manipulation}button.primary{background:#177a70;border-color:#5cdbbc}button:disabled{opacity:.35}#footnote{font-size:clamp(10px,1.4vw,16px);color:#a6b7c9;text-align:center}#setup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}input{font:inherit;color:white;background:#162636;border:1px solid #72879d;border-radius:8px;padding:9px;max-width:200px}#progressbar{height:4px;background:#1d2b3b;position:absolute;bottom:0;left:0;width:100%}#progress{height:100%;background:#58d6b2;width:0;transition:width .25s}#overlay{display:none;position:fixed;inset:0;background:#080d15;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:24px}@media(orientation:portrait){#overlay{display:flex}}@media(max-height:390px){#visual{height:23vh}#main{gap:1vh}footer{height:16vh}header{height:6vh}}
body.aiming #app{padding:0}body.aiming header,body.aiming #title,body.aiming #hint,body.aiming #symbol,body.aiming #state,body.aiming #footnote,body.aiming #progressbar{display:none!important}body.aiming #main{position:fixed;inset:0;display:block}body.aiming #visual{position:fixed;inset:0;width:100vw;height:100dvh;min-height:0;display:block}body.aiming #aim{display:block!important;width:100%;height:100%;border:2px solid #718ba0;border-radius:0}body.aiming footer{position:fixed;bottom:8px;left:8px;right:8px;height:auto;z-index:3;pointer-events:none}body.aiming footer button{pointer-events:auto;opacity:.65;font-size:13px;padding:6px 12px;min-height:34px}#target{position:absolute;width:36px;height:36px;border:3px solid #62e8bd;border-radius:50%;transform:translate(-50%,-50%);left:50%;top:50%;box-shadow:0 0 18px #62e8bd88}#aimmsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#091622b8;border-radius:9px;padding:6px 12px;font-size:clamp(14px,2.4vw,25px);white-space:nowrap;z-index:2}body.aiming #cross{z-index:1;pointer-events:none}body.aiming #back{display:none}body.aiming #next{margin-left:auto}</style></head><body><div id="overlay">Fordítsd fekvő helyzetbe a telefont.</div><div id="app"><header><span>HEATWAVE · MOZGÁSKALIBRÁCIÓ</span><span id="phase">INDÍTÁS</span></header><main id="main"><h1 id="title">Mozgáskalibráció</h1><p id="hint">Tartsd a telefont két kézzel, fekvő helyzetben. A program hangosan végigvezet a feladatokon.</p><div id="visual"><div id="symbol">▶</div><div id="aim"><div id="target"></div><div id="aimmsg"></div><div id="cross">＋</div></div></div><div id="state">KÉSZEN ÁLLSZ?</div><div id="setup"><label>Telefon: <input id="phone" value="Telefon A" aria-label="Telefon azonosítója"></label></div></main><footer><button id="back" disabled>← Vissza</button><span id="footnote">A kezdéshez egyszer érintsd meg a gombot.</span><button id="next" class="primary">INDÍTÁS</button></footer><div id="progressbar"><div id="progress"></div></div></div><script>
'use strict';const $=id=>document.getElementById(id);const cfg={TILT_ENTER:2.5,TILT_EXIT:1,STEP_THRESHOLD:.9,STEP_MIN_REFRACTORY_MS:350,STEP_SETTLE_THRESHOLD:.5,STEP_SETTLE_DWELL_MS:80,STEP_DEFAULT_MAX_TIMEOUT_MS:900,STEP_SIGN_BAL:1};let started=false,calibrated=false,baseline=0,tilt='KOZEP',tiltSince=0,lane=1,lastStepTime=0,lastStep='—',settleLowSince=null,pending=null,stepSettles=[],maxTimeout=900,twistZero=null,aimZero=null,twist='KOZEP',log=[],idx=-1,lastLog=0,latest={ax:null,ay:null,az:null,gx:null,gy:null,gz:null,alpha:null,beta:null,gamma:null,ra:null,rb:null,rg:null,interval:null},hist=[],taskStart=0,stepCount=0,twistCount=0,stableStart=0,voiceOn=true,taskTimer=null,aimIndex=0,aimHold=0,aimXY={x:50,y:50};const aimPoints=[{x:8,y:10,t:'Bal felső sarok'},{x:50,y:10,t:'Felső szél közepe'},{x:92,y:10,t:'Jobb felső sarok'},{x:92,y:50,t:'Jobb szél közepe'},{x:92,y:90,t:'Jobb alsó sarok'},{x:50,y:90,t:'Alsó szél közepe'},{x:8,y:90,t:'Bal alsó sarok'},{x:8,y:50,t:'Bal szél közepe'},{x:50,y:50,t:'Vissza középre'}];
const stages=[
{title:'Alaphelyzet',hint:'Állj egyenesen, tartsd nyugodtan a telefont.',symbol:'●',mode:'base',duration:2800},
{title:'Dőlj hátra',hint:'Tartsd meg egy pillanatra, majd egyenesedj fel.',symbol:'↶',mode:'tilt',want:'FEL'},
{title:'Dőlj előre',hint:'Tartsd meg egy pillanatra, majd egyenesedj fel.',symbol:'↷',mode:'tilt',want:'LE'},
{title:'Lépj balra',hint:'Egy lépés. Utána állj meg.',symbol:'←',mode:'step',want:'BAL'},
{title:'Lépj jobbra',hint:'Egy lépés, vissza középre.',symbol:'→',mode:'step',want:'JOBB'},
{title:'Lépj jobbra',hint:'Még egy lépés jobbra.',symbol:'→',mode:'step',want:'JOBB'},
{title:'Lépj kétszer balra',hint:'Két külön lépés, kényelmes tempóban.',symbol:'← ←',mode:'steps',want:'BAL',count:2},
{title:'Lépj kétszer jobbra',hint:'Két külön lépés, kényelmes tempóban.',symbol:'→ →',mode:'steps',want:'JOBB',count:2},
{title:'Lépj balra',hint:'Vissza középre.',symbol:'←',mode:'step',want:'BAL'},
{title:'Törzsfordítás: közép',hint:'Nézz előre, a telefont tartsd magad előtt.',symbol:'●',mode:'twistbase',duration:2300},
{title:'Fordulj balra',hint:'A törzseddel fordulj, majd vissza középre.',symbol:'↶',mode:'twist',want:'BAL'},
{title:'Fordulj jobbra',hint:'A törzseddel fordulj, majd vissza középre.',symbol:'↷',mode:'twist',want:'JOBB'},
{title:'Váltott törzsfordítás',hint:'Balra, középre, jobbra, középre. Kényelmesen.',symbol:'↶ ↷',mode:'twistcycle',count:4},
{title:'Célzás: közép',hint:'Tartsd kényelmesen a telefont. Ez lesz a célzás alaphelyzete.',symbol:'＋',mode:'aimbase',duration:2300},
{title:'Célzás a képernyő kerületén',hint:'Vezesd a célkeresztet a megjelenő pontokra, a teljes képernyő szélein.',symbol:'＋',mode:'aimpath'},
{title:'Kész!',hint:'A teszt véget ért. Mentsd el a CSV-t, majd próbáld ki a másik telefonon.',symbol:'✓',mode:'done'}];
function mark(type,extra={}){log.push({time:new Date().toISOString(),ms:Math.round(performance.now()),phone:$('phone').value||'Telefon',stage:idx+1,type,lane,tilt,twist,step:lastStep,...latest,...extra});}function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];}function angleDelta(a,b){return ((a-b+540)%360)-180;}function say(s){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='hu-HU';u.rate=.94;speechSynthesis.speak(u);}function stepDetect(v){if(!calibrated||!Number.isFinite(v))return;const now=performance.now(),av=Math.abs(v);if(pending){if(av<cfg.STEP_SETTLE_THRESHOLD){if(pending.below===null)pending.below=now;else if(now-pending.below>=cfg.STEP_SETTLE_DWELL_MS){stepSettles.push(now-pending.time);if(stepSettles.length>100)stepSettles.shift();if(stepSettles.length>=2)maxTimeout=Math.min(1500,Math.max(500,Math.max(...stepSettles)+150));pending=null;}}else pending.below=null;}const elapsed=now-lastStepTime;if(elapsed<cfg.STEP_MIN_REFRACTORY_MS)return;let ready=false;if(elapsed>=maxTimeout)ready=true;else if(av<cfg.STEP_SETTLE_THRESHOLD){if(settleLowSince===null)settleLowSince=now;else if(now-settleLowSince>=cfg.STEP_SETTLE_DWELL_MS)ready=true;}else settleLowSince=null;if(!ready||av<=cfg.STEP_THRESHOLD)return;const dir=Math.sign(v)===cfg.STEP_SIGN_BAL?'BAL':'JOBB';if((dir==='BAL'&&lane===0)||(dir==='JOBB'&&lane===2))return;settleLowSince=null;pending={time:now,below:null};lastStep=dir;lastStepTime=now;lane+=dir==='BAL'?-1:1;mark('step',{direction:dir,amplitude:v});const s=stages[idx];if(s&&(s.mode==='step'||s.mode==='steps')&&dir===s.want){stepCount++;$('state').textContent=stepCount+'/'+(s.count||1)+' LÉPÉS';if(stepCount>=(s.count||1))success();}}
function orient(e){latest.alpha=e.alpha;latest.beta=e.beta;latest.gamma=e.gamma;}function motion(e){const a=e.acceleration||{},g=e.accelerationIncludingGravity||{},r=e.rotationRate||{};Object.assign(latest,{ax:a.x??null,ay:a.y??null,az:a.z??null,gx:g.x??null,gy:g.y??null,gz:g.z??null,ra:r.alpha??null,rb:r.beta??null,rg:r.gamma??null,interval:e.interval??null});if(Number.isFinite(latest.gz)){hist.push(latest.gz);if(hist.length>9)hist.shift();}stepDetect(latest.ay);}
async function start(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Tájolási engedély elutasítva');}if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){if(await DeviceMotionEvent.requestPermission()!=='granted')throw Error('Mozgási engedély elutasítva');}window.addEventListener('deviceorientation',orient);window.addEventListener('devicemotion',motion);started=true;mark('start',{agent:navigator.userAgent});$('setup').style.display='none';setInterval(tick,40);go(0);}catch(e){$('hint').textContent='Nem sikerült elindítani a szenzorokat: '+e.message+' (HTTPS szükséges lehet.)';say('A szenzorok nem indultak el.');}}
function calibrate(){baseline=hist.length?median(hist):(latest.gz||0);tilt='KOZEP';tiltSince=performance.now();lane=1;lastStepTime=0;lastStep='—';settleLowSince=null;pending=null;stepSettles=[];maxTimeout=900;calibrated=true;mark('calibrate',{baseline});}function tick(){if(!started)return;const now=performance.now();if(calibrated&&hist.length){const dz=median(hist)-baseline,old=tilt;if(tilt==='KOZEP'){if(dz>cfg.TILT_ENTER)tilt='FEL';else if(dz< -cfg.TILT_ENTER)tilt='LE';}else if(tilt==='FEL'&&dz<cfg.TILT_EXIT)tilt='KOZEP';else if(tilt==='LE'&&dz> -cfg.TILT_EXIT)tilt='KOZEP';if(old!==tilt){tiltSince=now;mark('tilt_change',{from:old,to:tilt,dz});}if(tilt!=='KOZEP'&&now-tiltSince>4000){tilt='KOZEP';tiltSince=now;mark('tilt_timeout');}}
const a=latest.alpha,b=latest.beta;if(Number.isFinite(a)&&twistZero!==null){const da=angleDelta(a,twistZero),th=12,exit=6.6;let n=twist;if(twist==='KOZEP'){if(da>th)n='JOBB';else if(da< -th)n='BAL';}else if(Math.abs(da)<exit)n='KOZEP';else if(twist==='BAL'&&da>th)n='JOBB';else if(twist==='JOBB'&&da< -th)n='BAL';if(n!==twist){twist=n;mark('twist_change',{angle:da});const s=stages[idx];if(s&&s.mode==='twistcycle'&&n!=='KOZEP'){twistCount++;$('state').textContent=twistCount+'/'+s.count+' FORDULÁS';if(twistCount>=s.count)success();}}}
if(aimZero&&Number.isFinite(a)&&Number.isFinite(b)){const x=Math.max(-48,Math.min(48,angleDelta(a,aimZero.a)*2.2)),y=Math.max(-45,Math.min(45,(b-aimZero.b)*2.2));$('cross').style.left=(50+x)+'%';$('cross').style.top=(50+y)+'%';aimXY={x:50+x,y:50+y};}
const s=stages[idx];if(s){if(s.mode==='tilt'&&tilt===s.want){if(!stableStart)stableStart=now;if(now-stableStart>450)success();}else if(s.mode==='tilt')stableStart=0;if(s.mode==='twist'&&twist===s.want){if(!stableStart)stableStart=now;if(now-stableStart>350)success();}else if(s.mode==='twist')stableStart=0;if(s.mode==='base'&&now-taskStart>=s.duration){calibrate();success();}if(s.mode==='twistbase'&&now-taskStart>=s.duration){if(Number.isFinite(a)){twistZero=a;twist='KOZEP';mark('twist_zero',{zero:a});success();}else $('state').textContent='NINCS TÁJOLÁSI ADAT';}if(s.mode==='aimbase'&&now-taskStart>=s.duration){if(Number.isFinite(a)&&Number.isFinite(b)){aimZero={a,b};mark('aim_zero',{a,b});success();}else $('state').textContent='NINCS TÁJOLÁSI ADAT';}if(s.mode==='aimpath'&&aimZero){const q=aimPoints[aimIndex];if(q&&Math.hypot(aimXY.x-q.x,aimXY.y-q.y)<10){if(!aimHold)aimHold=now;if(now-aimHold>300){mark('aim_checkpoint',{checkpoint:aimIndex+1,targetX:q.x,targetY:q.y,aimX:aimXY.x,aimY:aimXY.y});aimIndex++;aimHold=0;if(aimIndex>=aimPoints.length)success();else updateAimTarget(true);}}else aimHold=0;}}
if(now-lastLog>100){mark('sample');lastLog=now;}}
function updateAimTarget(speak){const q=aimPoints[aimIndex];if(!q)return;$('target').style.left=q.x+'%';$('target').style.top=q.y+'%';$('aimmsg').textContent=(aimIndex+1)+' / '+aimPoints.length+' · '+q.t;if(speak)say(q.t);}
function success(){if(taskTimer)return;mark('stage_success');$('state').textContent='SIKERÜLT ✓';taskTimer=setTimeout(()=>{taskTimer=null;go(idx+1)},1000);}function go(i){clearTimeout(taskTimer);taskTimer=null;if(i<0||i>=stages.length)return;idx=i;taskStart=performance.now();stableStart=0;stepCount=0;twistCount=0;aimIndex=0;aimHold=0;const s=stages[i];document.body.classList.toggle('aiming',s.mode==='aimpath');if(s.mode==='aimpath')updateAimTarget(false);$('title').textContent=s.title;$('hint').textContent=s.hint;$('symbol').textContent=s.symbol;$('symbol').style.display=s.mode==='aimpath'?'none':'block';$('aim').style.display=s.mode==='aimpath'?'block':'none';$('phase').textContent=(i+1)+' / '+stages.length;$('progress').style.width=((i+1)/stages.length*100)+'%';$('back').disabled=i===0;$('next').textContent=s.mode==='done'?'CSV MENTÉSE':'TOVÁBB →';$('state').textContent=s.mode==='done'?'TELJESÍTVE':s.mode==='base'||s.mode==='twistbase'||s.mode==='aimbase'?'MARADJ NYUGODTAN':s.mode==='aimpath'?'KÖVESD A PONTOKAT':'VÁROM A MOZGÁST';$('footnote').textContent=s.mode==='done'?'A két telefon mérését külön mentsd el.':'Automatikusan továbblép; ha nem érzékeli, használd a TOVÁBB gombot.';mark('stage_start',{instruction:s.title});say(s.title+'. '+s.hint);}
function csv(){const keys=[...new Set(log.flatMap(x=>Object.keys(x)))],esc=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};const content='\ufeff'+keys.join(',')+'\n'+log.map(r=>keys.map(k=>esc(r[k])).join(',')).join('\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='heatwave_'+($('phone').value||'telefon').replace(/[^\w-]/g,'_')+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('next').onclick=()=>{if(!started)start();else if(stages[idx].mode==='done')csv();else go(Math.min(idx+1,stages.length-1));};$('back').onclick=()=>go(idx-1);document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel();});
</script></body></html>
